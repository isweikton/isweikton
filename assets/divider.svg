<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8" role="img" aria-label="divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#64748B" stop-opacity="1"/>
      <stop offset="1" stop-color="#64748B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="3" width="900" height="1.5" fill="url(#base)"/>

  <g>
    <rect x="0" y="3" width="240" height="2" rx="1" fill="url(#pulse)"/>
    <circle cx="120" cy="4" r="2.6" fill="#38BDF8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="translate" values="-240 0;900 0" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
