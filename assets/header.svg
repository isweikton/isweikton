<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="weikton">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#22D3EE;#818CF8;#38BDF8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#E6EDF3"/>
      <stop offset="1" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#22D3EE;#38BDF8" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rainFadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.22" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#16202C" stroke-width="1"/>
    </pattern>

    <mask id="rainFade">
      <rect x="1" y="1" width="998" height="298" fill="url(#rainFadeGrad)"/>
    </mask>

    <g id="c1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#38BDF8" text-anchor="middle">
      <text y="0">4f</text><text y="18">a3</text><text y="36">00</text><text y="54">1c</text>
      <text y="72">e9</text><text y="90">7b</text><text y="108">30</text><text y="126">ff</text>
      <text y="144">12</text><text y="162">8d</text><text y="180">5a</text><text y="198">06</text>
    </g>
    <g id="c2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#38BDF8" text-anchor="middle">
      <text y="0">3f</text><text y="18">80</text><text y="36">00</text><text y="54">00</text>
      <text y="72">b5</text><text y="90">70</text><text y="108">68</text><text y="126">41</text>
      <text y="144">f0</text><text y="162">04</text><text y="180">2d</text><text y="198">e9</text>
    </g>
    <g id="c3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#38BDF8" text-anchor="middle">
      <text y="0">7a</text><text y="18">1e</text><text y="36">c0</text><text y="54">46</text>
      <text y="72">22</text><text y="90">9b</text><text y="108">0d</text><text y="126">f1</text>
      <text y="144">4b</text><text y="162">33</text><text y="180">aa</text><text y="198">55</text>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="18" fill="url(#bg)" stroke="#1B2530"/>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="url(#grid)" opacity="0.5"/>

  <g mask="url(#rainFade)" opacity="0.16">
    <g transform="translate(52 0)"><g><use href="#c1" xlink:href="#c1" y="-216"/><use href="#c1" xlink:href="#c1" y="0"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 216" dur="9s" repeatCount="indefinite"/></g></g>
    <g transform="translate(158 0)"><g><use href="#c2" xlink:href="#c2" y="-216"/><use href="#c2" xlink:href="#c2" y="0"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 216" dur="13s" repeatCount="indefinite"/></g></g>
    <g transform="translate(264 0)"><g><use href="#c3" xlink:href="#c3" y="-216"/><use href="#c3" xlink:href="#c3" y="0"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 216" dur="11s" repeatCount="indefinite"/></g></g>
    <g transform="translate(370 0)"><g><use href="#c1" xlink:href="#c1" y="-216"/><use href="#c1" xlink:href="#c1" y="0"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 216" dur="15s" repeatCount="indefinite"/></g></g>
    <g transform="translate(630 0)"><g><use href="#c2" xlink:href="#c2" y="-216"/><use href="#c2" xlink:href="#c2" y="0"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 216" dur="10s" repeatCount="indefinite"/></g></g>
    <g transform="translate(736 0)"><g><use href="#c3" xlink:href="#c3" y="-216"/><use href="#c3" xlink:href="#c3" y="0"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 216" dur="14s" repeatCount="indefinite"/></g></g>
    <g transform="translate(842 0)"><g><use href="#c1" xlink:href="#c1" y="-216"/><use href="#c1" xlink:href="#c1" y="0"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 216" dur="12s" repeatCount="indefinite"/></g></g>
    <g transform="translate(948 0)"><g><use href="#c2" xlink:href="#c2" y="-216"/><use href="#c2" xlink:href="#c2" y="0"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 216" dur="16s" repeatCount="indefinite"/></g></g>
  </g>

  <rect x="1" y="1" width="998" height="298" rx="18" fill="url(#glowA)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="500" y="70" text-anchor="middle" font-size="11" letter-spacing="4.5" fill="#38BDF8" opacity="0.8">$ ./weikton --whoami</text>

    <text x="486" y="162" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="4" fill="url(#wm)">weikton</text>
    <rect x="678" y="132" width="16" height="34" fill="#38BDF8">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/>
    </rect>

    <text x="500" y="196" text-anchor="middle" font-size="12" letter-spacing="4.2" fill="#64748B">I TAKE BINARIES APART AND PUT THEM BACK AS SOURCE</text>

    <g font-size="10.5" letter-spacing="2.2" text-anchor="middle">
      <rect x="342" y="216" width="112" height="26" rx="13" fill="none" stroke="#243244"/>
      <text x="398" y="233" fill="#94A3B8">ARM / ARM64</text>

      <rect x="466" y="216" width="112" height="26" rx="13" fill="none" stroke="#243244"/>
      <text x="522" y="233" fill="#94A3B8">GTA:SA 2.10</text>

      <rect x="590" y="216" width="76" height="26" rx="13" fill="none" stroke="#243244"/>
      <text x="628" y="233" fill="#94A3B8">SA:MP</text>
    </g>
  </g>

  <g transform="translate(36 268)">
    <rect x="0" y="0" width="928" height="1" fill="#1B2530"/>
    <rect x="0" y="-1" width="220" height="3" rx="1.5" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" values="0 0;708 0;0 0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
