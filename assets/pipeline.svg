      <rect x="56" y="34" width="150" height="44" rx="10" fill="none" stroke="#38BDF8" opacity="0">
        <animate attributeName="opacity" values="0;0.85;0" dur="6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="131" y="60" fill="#E6EDF3">libGame.so</text>
      <text x="131" y="97" fill="#475569" font-size="9.5" letter-spacing="1.8">SOURCE OF TRUTH</text>
    </g>

    <g>
      <rect x="238" y="34" width="110" height="44" rx="10" fill="#0D1117" stroke="#243244"/>
      <rect x="238" y="34" width="110" height="44" rx="10" fill="none" stroke="#38BDF8" opacity="0">
        <animate attributeName="opacity" values="0;0.85;0" dur="6s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <text x="293" y="60" fill="#E6EDF3">DWARF</text>
      <text x="293" y="97" fill="#475569" font-size="9.5" letter-spacing="1.8">NAMES</text>
    </g>

    <g>
      <rect x="380" y="34" width="170" height="44" rx="10" fill="#0D1117" stroke="#243244"/>
      <rect x="380" y="34" width="170" height="44" rx="10" fill="none" stroke="#38BDF8" opacity="0">
        <animate attributeName="opacity" values="0;0.85;0" dur="6s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
      <text x="465" y="60" fill="#E6EDF3">thumb-2 / arm64</text>
      <text x="465" y="97" fill="#475569" font-size="9.5" letter-spacing="1.8">DISASSEMBLY</text>
    </g>

    <g>
      <rect x="582" y="34" width="120" height="44" rx="10" fill="#0D1117" stroke="#243244"/>
      <rect x="582" y="34" width="120" height="44" rx="10" fill="none" stroke="#38BDF8" opacity="0">
        <animate attributeName="opacity" values="0;0.85;0" dur="6s" begin="2.7s" repeatCount="indefinite"/>
      </rect>
      <text x="642" y="60" fill="#E6EDF3">c++ 1:1</text>
      <text x="642" y="97" fill="#475569" font-size="9.5" letter-spacing="1.8">REWRITE</text>
    </g>

    <g>
      <rect x="734" y="34" width="110" height="44" rx="10" fill="#0D1117" stroke="#38BDF8" stroke-opacity="0.45"/>
      <rect x="734" y="34" width="110" height="44" rx="10" fill="none" stroke="#38BDF8" opacity="0">
        <animate attributeName="opacity" values="0;0.95;0" dur="6s" begin="3.6s" repeatCount="indefinite"/>
