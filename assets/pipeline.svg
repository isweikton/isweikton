<svg xmlns="http://www.w3.org/2000/svg" width="900" height="118" viewBox="0 0 900 118" role="img" aria-label="binary to engine pipeline">
  <defs>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B2530"/>
      <stop offset="1" stop-color="#243244"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="url(#link)" stroke-width="1.5" stroke-linecap="round">
    <path d="M206 56 H238"/>
    <path d="M348 56 H380"/>
    <path d="M550 56 H582"/>
    <path d="M702 56 H734"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" text-anchor="middle">
    <g>
