    <circle cx="0" cy="0" r="2.6" fill="#BAE6FD"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.06;0.5;0.92;1" dur="6s" repeatCount="indefinite"/>
    <animateMotion dur="6s" repeatCount="indefinite" path="M206 56 H734"/>
